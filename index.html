<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#FFFFFF">
<title>Монитор замечаний · Школа</title>
<style>
  :root{
    --bg:#EEF1F4; --surface:#FFFFFF; --ink:#172230; --muted:#6B7888;
    --line:#E2E7ED; --line-strong:#CBD3DC;
    --amber:#F2A20C; --amber-soft:#FCEFD2; --amber-ink:#8a5a00;
    --blue:#2F6FE4; --blue-soft:#E4EDFC;
    --green:#1F9D57; --green-soft:#DCF3E6;
    --grey:#8A97A6; --grey-soft:#EAEEF2;
    --shadow:0 1px 2px rgba(23,34,48,.06),0 4px 16px rgba(23,34,48,.05);
    --tap:44px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;overflow-x:hidden}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  /* ---------- Login ---------- */
  .login{position:fixed;inset:0;z-index:100;background:#1b2734;display:none;align-items:center;justify-content:center;padding:20px}
  .login.on{display:flex}
  .login-card{background:var(--surface);border-radius:16px;padding:28px 24px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
  .login-card .logo{width:48px;height:48px;border-radius:12px;margin:0 auto 14px;background:linear-gradient(135deg,var(--amber),#d98a00);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px}
  .login-card h2{margin:0 0 4px;font-size:18px}
  .login-card p{margin:0 0 16px;color:var(--muted);font-size:13px}
  .login-card input{width:100%;font-family:inherit;font-size:16px;padding:13px;border:1px solid var(--line-strong);border-radius:10px;text-align:center;letter-spacing:3px}
  .login-card input:focus{outline:2px solid var(--blue);outline-offset:1px}
  .login-card .primary{width:100%;margin-top:10px;font-family:inherit;font-size:16px;font-weight:600;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:14px;cursor:pointer}
  .login-card .primary[disabled]{opacity:.55;cursor:default}
  .login-card .skip{width:100%;margin-top:8px;background:none;border:0;color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:6px}
  .login-err{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px}

  /* ---------- Header ---------- */
  header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top)}
  /* сплошная подложка под зоной выреза/статус-бара, чтобы список не просвечивал сверху */
  header::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top);background:var(--surface)}
  .head-top{display:flex;align-items:center;gap:11px;padding:11px 14px}
  .logo{width:32px;height:32px;border-radius:9px;flex:0 0 auto;background:linear-gradient(135deg,var(--amber),#d98a00);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px}
  .title h1{font-size:15.5px;margin:0;font-weight:700;letter-spacing:-.2px}
  .title p{margin:0;font-size:11.5px;color:var(--muted)}
  .head-top .spacer{flex:1}
  .refresh-btn{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;display:flex;align-items:center;border-radius:8px;min-width:var(--tap);min-height:var(--tap);justify-content:center}
  .refresh-btn:hover{background:var(--grey-soft);color:var(--ink)}
  .refresh-btn.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .role-badge{display:flex;align-items:center;gap:7px}
  .role-pill{font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;background:var(--amber-soft);color:var(--amber-ink);white-space:nowrap}
  .role-pill.observer{background:var(--grey-soft);color:#566472}
  .role-pill.contractor{background:var(--blue-soft);color:#1d4fb0}
  .change-role{font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;padding:6px 2px}
  button:focus-visible,select:focus,input:focus{outline:2px solid var(--blue);outline-offset:1px}

  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:9px 14px;border-top:1px solid var(--line)}
  .search{flex:1;min-width:150px;position:relative}
  .search input{width:100%;font-family:inherit;font-size:16px;padding:10px 12px 10px 34px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .view-switch{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
  .view-switch button{border:0;background:var(--surface);padding:9px 11px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:5px;font-family:inherit;font-size:12px;min-height:var(--tap)}
  .view-switch button+button{border-left:1px solid var(--line)}
  .view-switch button.active{background:var(--ink);color:#fff}
  .view-switch button span{display:inline}
  .filters-toggle{display:none;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 13px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;min-height:var(--tap)}
  .filters-toggle .fcount{font-size:11px;background:var(--ink);color:#fff;border-radius:20px;padding:1px 7px}

  .group-bar{display:flex;align-items:center;gap:8px;padding:6px 14px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
  .gb-label{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  .gchip{font-size:13px;padding:8px 13px;border-radius:20px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:6px;transition:.12s}
  .gchip:hover{border-color:var(--muted)}
  .gchip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .gchip .lvl{font-size:10px;font-weight:700;width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--amber);color:#fff}
  .gb-clear{font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;margin-left:2px;padding:6px 2px}

  .stats{display:flex;gap:8px;padding:2px 14px 8px;flex-wrap:wrap}
  .chip{font-size:12.5px;padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:6px}
  .chip.active{border-color:var(--ink);color:var(--ink);font-weight:600}
  .chip b{font-weight:700;color:var(--ink)}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .dot.open{background:var(--grey)} .dot.check{background:var(--blue)} .dot.done{background:var(--green)}
  .role-note{font-size:12px;color:var(--muted);padding:3px 14px 9px}

  /* pull-to-refresh */
  .ptr{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;align-items:center;justify-content:center;height:0;overflow:hidden;color:var(--muted);font-size:12px;z-index:20;pointer-events:none;transition:height .15s}
  .ptr svg{margin-right:6px}
  .ptr.loading svg{animation:spin .8s linear infinite}

  main{padding:8px 14px 96px;max-width:1100px;margin:0 auto}
  .group{margin-top:8px}
  .group.lvl1{margin-top:16px}
  .group:not(.lvl1){margin-left:12px;padding-left:12px;border-left:2px solid var(--line)}
  .group-head{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;padding:8px 4px;min-height:var(--tap)}
  .group-head .caret{transition:transform .15s;color:var(--muted);flex:0 0 auto}
  .group.collapsed>.items-wrap{display:none}
  .group.collapsed .caret{transform:rotate(-90deg)}
  .group-head h2{font-size:13px;margin:0;font-weight:700;letter-spacing:.2px;text-transform:uppercase;color:var(--ink)}
  .group-head.gh2 h2{font-size:12.5px;font-weight:600;text-transform:none;letter-spacing:0;color:#465260}
  .group-head .gcount{font-size:11.5px;color:var(--muted);background:var(--grey-soft);padding:2px 8px;border-radius:20px;white-space:nowrap}
  .group-head .gbar{flex:1;height:1px;background:var(--line)}

  .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .b-open{background:var(--grey-soft);color:#566472}
  .b-check{background:var(--blue-soft);color:#1d4fb0}
  .b-done{background:var(--green-soft);color:#137a41}
  .elem-tag{font-size:11px;font-weight:600;color:var(--amber-ink);background:var(--amber-soft);padding:2px 8px;border-radius:6px}
  .meta{font-size:12px;color:var(--muted)}
  .meta b{color:var(--ink);font-weight:600}
  .thumb{border-radius:8px;background:var(--grey-soft);object-fit:cover;cursor:pointer;flex:0 0 auto;border:1px solid var(--line);display:block}
  .thumb.nophoto{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px;text-align:center;cursor:default;line-height:1.2;padding:4px}
  .thumb.loading{background:linear-gradient(90deg,#e9edf1 25%,#f3f6f9 37%,#e9edf1 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .act{font-family:inherit;font-size:13px;font-weight:600;border-radius:9px;padding:9px 13px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:40px}
  .act[disabled]{opacity:.5;cursor:default}
  .act-done{background:var(--green);color:#fff}
  .act-accept{background:var(--blue);color:#fff}
  .act-reject{background:var(--surface);color:#b13b3b;border-color:#e7c3c3}
  .locked{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;font-style:italic}

  .v-list .item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:7px;box-shadow:var(--shadow)}
  .v-list .thumb{width:48px;height:48px}
  .v-list .li-main{flex:1;min-width:0}
  .v-list .li-remark{font-weight:600;margin-bottom:3px}
  .v-list .li-sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .v-list .li-act{display:flex;align-items:center;gap:7px;flex:0 0 auto}

  .v-cards .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .v-cards .item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
  .v-cards .c-top{display:flex;gap:10px;align-items:flex-start}
  .v-cards .thumb{width:64px;height:64px}
  .v-cards .c-body{flex:1;min-width:0}
  .v-cards .c-remark{font-weight:600;margin:3px 0 6px}
  .v-cards .c-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
  .v-cards .c-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:9px}

  .v-big .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .v-big .item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .v-big .big-photo{width:100%;height:210px;object-fit:cover;cursor:pointer;background:var(--grey-soft);display:block}
  .v-big .big-photo.nophoto{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;cursor:default;flex-direction:column;gap:6px}
  .v-big .big-body{padding:14px;display:flex;flex-direction:column;gap:10px}
  .v-big .big-tags{display:flex;gap:6px;flex-wrap:wrap}
  .v-big .big-remark{font-size:16px;font-weight:700;line-height:1.3}
  .v-big .big-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
  .v-big .big-grid dt{color:var(--muted)} .v-big .big-grid dd{margin:0;font-weight:600}
  .v-big .big-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:12px}

  .lightbox{position:fixed;inset:0;z-index:80;background:rgba(10,16,24,.88);display:none;align-items:center;justify-content:center;padding:16px}
  .lightbox.on{display:flex}
  .lb-inner{max-width:920px;width:100%;max-height:92vh;display:flex;flex-direction:column;gap:10px}
  .lb-inner img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:10px;margin:0 auto;display:block}
  .lb-bar{display:flex;align-items:center;justify-content:space-between;color:#fff;gap:12px}
  .lb-bar .lb-meta{font-size:13px;opacity:.9}
  .lb-close{background:rgba(255,255,255,.16);border:0;color:#fff;width:42px;height:42px;border-radius:50%;font-size:22px;cursor:pointer;flex:0 0 auto}
  .lb-spin{color:#fff;text-align:center;font-size:13px;opacity:.8}

  .empty,.loading-state,.error-state{text-align:center;padding:56px 20px;color:var(--muted)}
  .empty svg,.error-state svg{margin-bottom:12px;opacity:.5}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
  .retry-btn{margin-top:14px;font-family:inherit;font-size:14px;font-weight:600;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
  .skel{background:var(--surface);border:1px solid var(--line);border-radius:11px;height:70px;margin-bottom:7px;box-shadow:var(--shadow);background-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.03) 40%,transparent 80%);background-size:300% 100%;animation:shimmer 1.3s ease infinite}

  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:#b13b3b}

  /* ---------- MOBILE ---------- */
  @media(max-width:640px){
    header{transition:transform .25s ease;will-change:transform}
    header.hide{transform:translateY(-100%)}
    .head-top{flex-wrap:wrap;gap:9px}
    .role-badge{order:4;width:100%;justify-content:space-between;border-top:1px solid var(--line);padding-top:9px;margin-top:2px}
    .search{flex-basis:100%}
    .view-switch{flex:1}
    .view-switch button{flex:1;justify-content:center}
    .view-switch button span{display:none}
    .filters-toggle{display:inline-flex}
    .filters{display:none}
    .filters.open{display:block;border-top:1px solid var(--line)}
    .group-bar,.stats{border-top:0}
    .group:not(.lvl1){margin-left:7px;padding-left:9px}
    .group-head h2{font-size:12.5px}
    .v-list .item{flex-wrap:wrap;align-items:flex-start}
    .v-list .li-act{width:100%;gap:8px;margin-top:4px}
    .v-list .li-act .act{flex:1}
    .v-list .li-act .locked{flex:1;justify-content:center;padding:9px}
    .v-cards .c-foot{flex-wrap:wrap}
    .v-cards .c-foot>div{width:100%;display:flex;gap:8px}
    .v-cards .c-foot .act{flex:1}
    .v-big .big-foot{flex-wrap:wrap}
    .v-big .big-foot>div{width:100%;display:flex;gap:8px}
    .v-big .big-foot .act{flex:1}
  }
</style>
</head>
<body>

<div class="ptr" id="ptr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg><span id="ptrText">Потяните для обновления</span></div>

<div class="login" id="login">
  <div class="login-card">
    <div class="logo">⚠</div>
    <h2>Войти под ролью</h2>
    <p>Для отметок нужен пароль роли</p>
    <input type="password" id="pwd" placeholder="••••" autocomplete="off" inputmode="numeric">
    <button class="primary" id="loginBtn">Войти</button>
    <button class="skip" id="loginSkip">Продолжить как Наблюдатель</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<header>
  <div class="head-top">
    <div class="logo">⚠</div>
    <div class="title">
      <h1>Монитор замечаний</h1>
      <p>Объект: Школа · <span id="totalCount">0</span> замечаний</p>
    </div>
    <div class="spacer"></div>
    <button class="refresh-btn" id="refreshBtn" title="Обновить" aria-label="Обновить">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg>
    </button>
    <div class="role-badge">
      <span class="role-pill" id="rolePill">—</span>
      <button class="change-role" id="changeRole">сменить роль</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="searchInp" type="text" placeholder="Поиск: замечание, помещение, элемент…" autocomplete="off">
    </div>
    <div class="view-switch" id="viewSwitch">
      <button data-view="list" class="active" title="Список">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Список</span>
      </button>
      <button data-view="cards" title="Карточки">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Карточки</span>
      </button>
      <button data-view="big" title="Большие">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="18" rx="1"/><rect x="13" y="3" width="8" height="18" rx="1"/></svg><span>Большие</span>
      </button>
    </div>
    <button class="filters-toggle" id="filtersToggle">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
      Группировка и фильтры <span class="fcount" id="fcount">2</span>
    </button>
  </div>

  <div class="filters" id="filters">
    <div class="group-bar" id="groupBar"></div>
    <div class="stats" id="statusFilter">
      <div class="chip active" data-status="all">Все <b id="cAll">0</b></div>
      <div class="chip" data-status="open"><span class="dot open"></span>Открыто <b id="cOpen">0</b></div>
      <div class="chip" data-status="check"><span class="dot check"></span>На проверке <b id="cCheck">0</b></div>
      <div class="chip" data-status="done"><span class="dot done"></span>Принято <b id="cDone">0</b></div>
    </div>
  </div>
  <div class="role-note" id="roleNote"></div>
</header>

<main id="app"></main>

<div class="lightbox" id="lightbox">
  <div class="lb-inner">
    <div class="lb-bar">
      <div class="lb-meta" id="lbMeta"></div>
      <button class="lb-close" id="lbClose" aria-label="Закрыть">×</button>
    </div>
    <div class="lb-spin" id="lbSpin" style="display:none">Загрузка фото…</div>
    <img id="lbImg" src="" alt="Фото замечания">
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
/* ===================== КОНФИГ И КОНСТАНТЫ ===================== */
const CONFIG = window.CONFIG || {};
const STATUS = {
  open:{label:"Открыто",badge:"b-open"},
  check:{label:"На проверке",badge:"b-check"},
  done:{label:"Принято",badge:"b-done"},
};
const ROLES = {
  observer:{name:"Наблюдатель",cls:"observer",note:"Режим просмотра. Изменять статус нельзя."},
  contractor:{name:"Подрядчик",cls:"contractor",note:"Можно отметить выполнение — замечание уйдёт на проверку."},
  brusnika:{name:"Брусника",cls:"",note:"Можно принять замечание сразу и в любой момент вернуть в работу."},
};
const GROUP_FIELDS = [
  {k:"floor",label:"Этаж"},{k:"block",label:"Блок"},{k:"room",label:"Помещение"},
  {k:"org",label:"Организация"},{k:"elem",label:"Элемент"},{k:"remark",label:"Замечание"},
];
const MAX_LEVELS = 6;

let DATA = [];
const state = {
  role:"observer", sessionToken:null,
  group:["block","room"], view:"list", search:"", status:"all",
  collapsed:new Set(), loaded:false, loadError:false
};

/* ===================== API ===================== */
async function apiGet(action, params={}){
  const url = new URL(CONFIG.API_URL);
  url.searchParams.set("action", action);
  url.searchParams.set("token", CONFIG.API_TOKEN);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const r = await fetch(url.toString(), {method:"GET"});
  return r.json();
}
async function apiPost(payload){
  // text/plain — чтобы не вызывать CORS-preflight (Apps Script его не обработает)
  const r = await fetch(CONFIG.API_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ token:CONFIG.API_TOKEN, ...payload })
  });
  return r.json();
}

/* ===================== ЗАГРУЗКА ДАННЫХ ===================== */
function configReady(){
  return CONFIG.API_URL && !/ВСТАВЬТЕ/.test(CONFIG.API_URL) &&
         CONFIG.API_TOKEN && !/ВСТАВЬТЕ/.test(CONFIG.API_TOKEN);
}

async function loadData(background=false){
  if(!configReady()){
    state.loadError = true;
    renderState("config");
    return;
  }
  if(!background && !state.loaded) renderState("loading");
  setRefreshing(true);
  try{
    const res = await apiGet(background ? "remarks" : "bootstrap");
    if(!res || !res.ok) throw new Error(res && res.error || "Ответ без ok");
    DATA = res.remarks || [];
    state.loaded = true; state.loadError = false;
    render();                 // сохраняем раскрытые группы/скролл
  }catch(err){
    state.loadError = true;
    if(!background) renderState("error", String(err));
    else toast("Не удалось обновить данные", true);
  }finally{
    setRefreshing(false);
  }
}

function setRefreshing(on){
  document.getElementById("refreshBtn").classList.toggle("spin", !!on);
}

/* ===================== АВТОРИЗАЦИЯ ===================== */
const loginEl=document.getElementById("login"),pwd=document.getElementById("pwd"),loginErr=document.getElementById("loginErr"),loginBtn=document.getElementById("loginBtn");

function setRole(role){
  state.role=role;
  const R=ROLES[role],pill=document.getElementById("rolePill");
  pill.textContent=R.name;pill.className="role-pill "+R.cls;
  document.getElementById("roleNote").textContent="● "+R.note;
  render();
}
async function doLogin(){
  const password=pwd.value.trim();
  if(!password){loginErr.textContent="Введите пароль";return;}
  loginBtn.disabled=true;loginErr.textContent="Проверка…";
  try{
    const res=await apiPost({action:"login", password});
    if(res.ok){
      state.sessionToken=res.sessionToken;
      loginErr.textContent="";loginEl.classList.remove("on");
      setRole(res.role);
      toast("Вы вошли как «"+res.roleName+"»");
    }else{
      loginErr.textContent=res.message||"Неверный пароль";pwd.value="";pwd.focus();
    }
  }catch(err){
    loginErr.textContent="Ошибка сети, попробуйте ещё раз";
  }finally{
    loginBtn.disabled=false;
  }
}
loginBtn.onclick=doLogin;
pwd.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
document.getElementById("loginSkip").onclick=()=>{loginEl.classList.remove("on");state.sessionToken=null;setRole("observer");};
document.getElementById("changeRole").onclick=()=>{pwd.value="";loginErr.textContent="";loginEl.classList.add("on");setTimeout(()=>pwd.focus(),50);};

/* ===================== ДЕЙСТВИЯ (СТАТУС) ===================== */
function actionsFor(it){
  const r=state.role,out=[];
  if(r==="contractor"){
    if(it.status==="open") out.push({to:"check",cls:"act-done",label:"Отметить выполнение"});
  }
  if(r==="brusnika"){
    if(it.status!=="done") out.push({to:"done",cls:"act-accept",label:"Принять"});
    if(it.status!=="open") out.push({to:"open",cls:"act-reject",label:"Вернуть в работу"});
  }
  return out;
}
async function applyAction(id,to,label){
  const it=DATA.find(d=>d.id===id);if(!it)return;
  const prev=it.status;
  it.status=to;render();                          // оптимистично
  try{
    const res=await apiPost({action:"setStatus", id, status:to, sessionToken:state.sessionToken, expectedStatus:prev});
    if(res.ok && res.remark){
      Object.assign(it,res.remark);               // берём правду с сервера
      render();
      toast(label+" · "+STATUS[to].label);
    }else{
      it.status=prev;render();                     // откат
      if(res.error==="CONFLICT"){
        toast("Статус успели изменить. Обновляю…",true);
        loadData(true);
      }else if(res.error==="AUTH"){
        toast("Сессия истекла, войдите заново",true);
        state.sessionToken=null;setRole("observer");
      }else{
        toast(res.message||"Не удалось сохранить",true);
      }
    }
  }catch(err){
    it.status=prev;render();
    toast("Ошибка сети при сохранении",true);
  }
}

/* ===================== ФОТО ===================== */
const photoCache=new Map();    // remarkId -> dataUrl (для прокси/лайтбокса)
function thumbURL(fileId){ return "https://drive.google.com/thumbnail?id="+fileId+"&sz=w400"; }
function fullURL(fileId){ return "https://drive.google.com/thumbnail?id="+fileId+"&sz=w1600"; }

// IntersectionObserver — грузим миниатюры лениво
const imgObserver=("IntersectionObserver" in window)?new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ loadThumb(e.target); imgObserver.unobserve(e.target);} });
},{rootMargin:"200px"}):null;

function loadThumb(img){
  const id=img.dataset.rid, fileId=img.dataset.fid;
  if(!fileId)return;
  if(CONFIG.PHOTO_VIA_PROXY){
    proxyPhoto(id).then(u=>{ if(u){img.src=u;img.classList.remove("loading");} else fail(img); }).catch(()=>fail(img));
  }else{
    img.onload=()=>img.classList.remove("loading");
    img.onerror=()=>{ // прямой thumbnail не дал картинку — пробуем прокси
      proxyPhoto(id).then(u=>{ if(u){img.onerror=null;img.src=u;img.classList.remove("loading");} else fail(img); }).catch(()=>fail(img));
    };
    img.src=thumbURL(fileId);
  }
  function fail(el){ el.classList.remove("loading"); el.classList.add("nophoto"); el.removeAttribute("src"); el.alt="нет фото"; }
}
async function proxyPhoto(remarkId){
  if(photoCache.has(remarkId))return photoCache.get(remarkId);
  try{
    const res=await apiGet("photo",{id:remarkId});
    if(res.ok&&res.dataUrl){ photoCache.set(remarkId,res.dataUrl); return res.dataUrl; }
  }catch(_){}
  return null;
}
function observeThumbs(){
  document.querySelectorAll("img.thumb[data-fid],img.big-photo[data-fid]").forEach(img=>{
    if(img.dataset.bound)return; img.dataset.bound="1";
    if(imgObserver)imgObserver.observe(img); else loadThumb(img);
  });
}

/* ===================== ЛАЙТБОКС ===================== */
const lb=document.getElementById("lightbox"),lbImg=document.getElementById("lbImg"),lbMeta=document.getElementById("lbMeta"),lbSpin=document.getElementById("lbSpin");
async function openPhoto(id){
  const d=DATA.find(x=>x.id===id);
  if(!d||!d.photo||!d.photo.available)return;
  lbMeta.textContent=`${d.elem} · Блок ${d.block} · пом. ${d.room} — ${d.remark}`;
  lbImg.style.display="none";lbSpin.style.display="block";lb.classList.add("on");
  const fileId=d.photo.fileId;
  const show=u=>{lbImg.onload=()=>{lbSpin.style.display="none";lbImg.style.display="block";};lbImg.onerror=tryProxy;lbImg.src=u;};
  const tryProxy=async()=>{const u=await proxyPhoto(id);if(u){lbImg.onerror=null;lbImg.onload=()=>{lbSpin.style.display="none";lbImg.style.display="block";};lbImg.src=u;}else{lbSpin.textContent="Фото недоступно";}};
  if(CONFIG.PHOTO_VIA_PROXY) tryProxy(); else show(fullURL(fileId));
}
function closePhoto(){lb.classList.remove("on");lbImg.src="";lbSpin.textContent="Загрузка фото…";}
document.getElementById("lbClose").onclick=closePhoto;
lb.onclick=e=>{if(e.target===lb||e.target.classList.contains("lb-inner"))closePhoto();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePhoto();});

/* ===================== ГРУППИРОВКА / РЕНДЕР ===================== */
function groupLabel(d,key){
  switch(key){
    case "floor":return "Этаж "+(d.floor??"—");
    case "block":return "Блок "+(d.block||"—");
    case "room":return "Помещение "+(d.room??"—");
    case "org":return d.org||"— не указано";
    case "elem":return d.elem||"— без элемента";
    case "remark":return d.remark||"—";
    case "status":return STATUS[d.status].label;
    case "by":return d.by||"— не указано";
    case "added":return d.added||"—";
  }
}
function filtered(){
  const q=state.search.trim().toLowerCase();
  return DATA.filter(d=>{
    if(state.status!=="all"&&d.status!==state.status)return false;
    if(q){const hay=(d.remark+" "+d.elem+" "+d.room+" "+d.block+" "+d.org+" "+d.by).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}
function groupBy(items,key){
  const m=new Map();
  items.forEach(d=>{const k=groupLabel(d,key);(m.get(k)||m.set(k,[]).get(k)).push(d);});
  return new Map([...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ru',{numeric:true})));
}

const app=document.getElementById("app");

function renderState(kind,detail){
  if(kind==="loading"){
    app.className="v-list";
    app.innerHTML=`<div class="loading-state"><div class="spinner"></div>Загрузка замечаний…</div>`+
      Array.from({length:5}).map(()=>`<div class="skel"></div>`).join("");
    return;
  }
  if(kind==="error"){
    app.className="";
    app.innerHTML=`<div class="error-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <div>Не удалось загрузить данные.</div><div class="meta" style="margin-top:6px">${esc(detail||"Проверьте интернет и доступность сервера")}</div>
      <button class="retry-btn" id="retryBtn">Повторить</button></div>`;
    document.getElementById("retryBtn").onclick=()=>loadData(false);
    return;
  }
  if(kind==="config"){
    app.className="";
    app.innerHTML=`<div class="error-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l9 5v6c0 5-3.5 8-9 9-5.5-1-9-4-9-9V7z"/></svg>
      <div>Не настроен <b>config.js</b>.</div><div class="meta" style="margin-top:6px">Укажите <b>API_URL</b> и <b>API_TOKEN</b> из развёрнутого Apps Script.</div></div>`;
    return;
  }
}

function render(){
  if(!state.loaded){ if(state.loadError) return; return; }
  const cnt=s=>DATA.filter(d=>d.status===s).length;
  document.getElementById("cAll").textContent=DATA.length;
  document.getElementById("cOpen").textContent=cnt("open");
  document.getElementById("cCheck").textContent=cnt("check");
  document.getElementById("cDone").textContent=cnt("done");
  document.getElementById("totalCount").textContent=DATA.length;
  document.getElementById("fcount").textContent=state.group.length||"—";

  const scrollY=window.scrollY;
  const items=filtered();
  app.className="v-"+state.view;
  if(!items.length){
    app.innerHTML=`<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><div>Ничего не найдено. Измените поиск или фильтр.</div></div>`;
    return;
  }
  if(state.group.length===0){
    app.innerHTML=`<div class="items">`+items.map(renderItem).join("")+`</div>`;
  }else{
    app.innerHTML=renderTree(items,state.group,0,"");
  }
  observeThumbs();
  window.scrollTo(0,scrollY);
}
function renderTree(items,fields,depth,prefix){
  if(depth===fields.length) return `<div class="items">`+items.map(renderItem).join("")+`</div>`;
  let html="";
  for(const[k,arr] of groupBy(items,fields[depth])){
    const path=prefix?prefix+"▸"+k:k, collapsed=state.collapsed.has(path);
    const lvlClass=depth===0?"lvl1":"lvl2";
    html+=`<section class="group ${lvlClass}${collapsed?" collapsed":""}">${head(k,arr,depth+1,path)}<div class="items-wrap">${renderTree(arr,fields,depth+1,path)}</div></section>`;
  }
  return html;
}
function head(title,arr,level,pathKey){
  const done=arr.filter(d=>d.status==="done").length;
  return `<div class="group-head${level>=2?" gh2":""}" data-key="${esc(pathKey)}"><svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg><h2>${esc(title)}</h2><span class="gcount">${arr.length} · ✓ ${done}</span><span class="gbar"></span></div>`;
}
function thumbHTML(d,cls){
  if(d.photo&&d.photo.available)
    return `<img class="thumb loading ${cls}" data-rid="${esc(d.id)}" data-fid="${esc(d.photo.fileId)}" data-photo="${esc(d.id)}" alt="Фото замечания">`;
  return `<div class="thumb ${cls} nophoto">нет<br>фото</div>`;
}
function statusBadge(d){const s=STATUS[d.status];return `<span class="badge ${s.badge}">${s.label}</span>`;}
function actBtns(d){
  const acts=actionsFor(d);
  if(!acts.length){
    if(d.status==="done")return `<span class="locked">✓ принято</span>`;
    if(state.role==="observer")return `<span class="locked">🔒 просмотр</span>`;
    return `<span class="locked">—</span>`;
  }
  return acts.map(a=>`<button class="act ${a.cls}" data-act="${esc(d.id)}|${a.to}|${esc(a.label)}">${esc(a.label)}</button>`).join("");
}
function renderItem(d){
  if(state.view==="list"){
    return `<div class="item">${thumbHTML(d,"")}<div class="li-main"><div class="li-remark">${esc(d.remark)}</div><div class="li-sub"><span class="elem-tag">${esc(d.elem)}</span><span class="meta">Блок <b>${esc(d.block)}</b> · пом. <b>${esc(String(d.room))}</b></span>${statusBadge(d)}</div></div><div class="li-act">${actBtns(d)}</div></div>`;
  }
  if(state.view==="cards"){
    return `<div class="item"><div class="c-top">${thumbHTML(d,"")}<div class="c-body"><div class="c-tags"><span class="elem-tag">${esc(d.elem)}</span>${statusBadge(d)}</div><div class="c-remark">${esc(d.remark)}</div><div class="meta">Блок <b>${esc(d.block)}</b> · пом. <b>${esc(String(d.room))}</b>${d.org?" · "+esc(d.org):""}</div></div></div><div class="c-foot"><span class="meta">${esc(d.by||"—")} · ${esc(d.added)}</span><div>${actBtns(d)}</div></div></div>`;
  }
  const photo=(d.photo&&d.photo.available)
    ?`<img class="big-photo loading" data-rid="${esc(d.id)}" data-fid="${esc(d.photo.fileId)}" data-photo="${esc(d.id)}" alt="Фото замечания">`
    :`<div class="big-photo nophoto"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l18 18M21 15V7a2 2 0 0 0-2-2h-8M3 7v12a2 2 0 0 0 2 2h12"/></svg><span>Фото нет</span></div>`;
  return `<div class="item">${photo}<div class="big-body"><div class="big-tags"><span class="elem-tag">${esc(d.elem)}</span>${statusBadge(d)}</div><div class="big-remark">${esc(d.remark)}</div><dl class="big-grid"><dt>Этаж / Блок</dt><dd>${esc(String(d.floor))} · ${esc(d.block)}</dd><dt>Помещение</dt><dd>${esc(String(d.room))}</dd><dt>Организация</dt><dd>${esc(d.org||"—")}</dd><dt>Внёс</dt><dd>${esc(d.by||"—")} · ${esc(d.added)}</dd></dl><div class="big-foot"><div>${actBtns(d)}</div></div></div></div>`;
}

/* ===================== ЧИПСЫ ГРУППИРОВКИ ===================== */
const groupBar=document.getElementById("groupBar");
function renderGroupChips(){
  let html=`<span class="gb-label">Группировка:</span>`;
  GROUP_FIELDS.forEach(f=>{
    const i=state.group.indexOf(f.k),sel=i>=0;
    html+=`<span class="gchip${sel?" sel":""}" data-group="${f.k}">${sel?`<span class="lvl">${i+1}</span>`:""}${f.label}</span>`;
  });
  if(state.group.length) html+=`<button class="gb-clear" id="gbClear">сбросить</button>`;
  groupBar.innerHTML=html;
}
groupBar.addEventListener("click",e=>{
  if(e.target.id==="gbClear"){state.group=[];state.collapsed.clear();renderGroupChips();render();return;}
  const c=e.target.closest("[data-group]");if(!c)return;
  const k=c.dataset.group,i=state.group.indexOf(k);
  if(i>=0) state.group.splice(i,1);
  else{if(state.group.length>=MAX_LEVELS){toast("Максимум "+MAX_LEVELS+" уровней группировки");return;}state.group.push(k);}
  state.collapsed.clear();renderGroupChips();render();
});

/* ===================== СОБЫТИЯ СПИСКА ===================== */
app.addEventListener("click",e=>{
  const ph=e.target.closest("[data-photo]");if(ph&&!ph.classList.contains("nophoto")){openPhoto(ph.dataset.photo);return;}
  const act=e.target.closest("[data-act]");if(act){const[id,to,label]=act.dataset.act.split("|");applyAction(id,to,label);return;}
  const gh=e.target.closest(".group-head");if(gh){const k=gh.dataset.key;state.collapsed.has(k)?state.collapsed.delete(k):state.collapsed.add(k);render();}
});
document.getElementById("searchInp").oninput=e=>{state.search=e.target.value;render();};
document.getElementById("viewSwitch").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(!b)return;state.view=b.dataset.view;[...document.querySelectorAll("#viewSwitch button")].forEach(x=>x.classList.toggle("active",x===b));render();});
document.getElementById("statusFilter").addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;state.status=c.dataset.status;[...document.querySelectorAll(".chip")].forEach(x=>x.classList.toggle("active",x===c));render();});
document.getElementById("filtersToggle").onclick=()=>document.getElementById("filters").classList.toggle("open");
document.getElementById("refreshBtn").onclick=()=>loadData(true);

/* ===================== УТИЛИТЫ ===================== */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));}
let toastT;function toast(msg,isErr){const t=document.getElementById("toast");t.textContent=msg;t.className="toast on"+(isErr?" err":"");clearTimeout(toastT);toastT=setTimeout(()=>t.className="toast",2200);}

/* ===================== АВТОСКРЫТИЕ ШАПКИ (только телефон) ===================== */
(function(){
  const header=document.querySelector("header");
  let lastY=window.scrollY||0, ticking=false;
  const isMobile=()=>window.matchMedia("(max-width:640px)").matches;
  function onScroll(){
    const y=window.scrollY||0;
    if(!isMobile()){ header.classList.remove("hide"); lastY=y; return; }
    const filtersOpen=document.getElementById("filters").classList.contains("open");
    const hh=header.offsetHeight;
    if(y<=hh+10 || filtersOpen) header.classList.remove("hide");      // у верха или открыты фильтры — всегда видна
    else if(y>lastY+6) header.classList.add("hide");                  // листаем вниз — прячем
    else if(y<lastY-6) header.classList.remove("hide");               // листаем вверх — показываем
    lastY=y;
  }
  window.addEventListener("scroll",()=>{
    if(!ticking){ requestAnimationFrame(()=>{onScroll();ticking=false;}); ticking=true; }
  },{passive:true});
  // если открыли панель фильтров — гарантированно показать шапку
  document.getElementById("filtersToggle").addEventListener("click",()=>header.classList.remove("hide"));
})();

/* ===================== PULL-TO-REFRESH ===================== */
(function(){
  const ptr=document.getElementById("ptr"),ptrText=document.getElementById("ptrText");
  let startY=0,pulling=false,dist=0;const TH=70;
  window.addEventListener("touchstart",e=>{if(window.scrollY<=0&&e.touches.length===1){startY=e.touches[0].clientY;pulling=true;}},{passive:true});
  window.addEventListener("touchmove",e=>{
    if(!pulling)return;dist=e.touches[0].clientY-startY;
    if(dist>0&&window.scrollY<=0){ptr.style.height=Math.min(dist,90)+"px";ptrText.textContent=dist>TH?"Отпустите для обновления":"Потяните для обновления";}
  },{passive:true});
  window.addEventListener("touchend",()=>{
    if(!pulling)return;pulling=false;
    if(dist>TH){ptr.classList.add("loading");ptr.style.height="44px";ptrText.textContent="Обновление…";
      loadData(true).finally(()=>{ptr.classList.remove("loading");ptr.style.height="0";});}
    else ptr.style.height="0";
    dist=0;
  });
})();

/* ===================== СТАРТ ===================== */
renderGroupChips();
setRole("observer");
loadData(false);
if(CONFIG.POLL_MS>0){ setInterval(()=>{ if(state.loaded&&!document.hidden) loadData(true); }, CONFIG.POLL_MS); }
</script>
